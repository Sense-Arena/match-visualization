name: Publish to NPM
on:
  push:
    branches: [main]
permissions:
  id-token: write # Required for OIDC
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-route
        shell: bash
        run: |
          echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules-v1
        with:
          path: ${{ steps.pnpm-route.outputs.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-

      - name: Install Node modules
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build and test npm package
        run: pnpm test:package

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test court interactions
        run: pnpm test:storybook

      - name: Publish package on NPM 📦
        uses: JS-DevTools/npm-publish@v4
        with:
          access: public
          ignore-scripts: 'false'
